name: 📊 毎日 GA4 → Notion 同期

on:
  schedule:
    # 毎日JST 1:00 (= UTC 16:00) に昨日分を取得
    - cron: "0 16 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "取得日 (YYYY-MM-DD)。空欄なら昨日"
        required: false
        default: ""
      force:
        description: "既存レコードを上書き (true/false)"
        required: false
        default: "false"

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
      GA4_SERVICE_ACCOUNT: ${{ secrets.GA4_SERVICE_ACCOUNT }}
      SC_SITE_URL: ${{ secrets.SC_SITE_URL }}
      NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
      NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
      NOTION_PARENT_PAGE_ID: ${{ secrets.NOTION_PARENT_PAGE_ID }}
      PAGESPEED_API_KEY: ${{ secrets.PAGESPEED_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required secrets
        id: secrets
        shell: bash
        run: |
          missing=()
          [ -n "$GA4_PROPERTY_ID" ] || missing+=("GA4_PROPERTY_ID")
          [ -n "$GA4_SERVICE_ACCOUNT" ] || missing+=("GA4_SERVICE_ACCOUNT")
          [ -n "$NOTION_API_KEY" ] || missing+=("NOTION_API_KEY")
          [ -n "$NOTION_DATABASE_ID" ] || missing+=("NOTION_DATABASE_ID")

          if [ ${#missing[@]} -gt 0 ]; then
            {
              echo "configured=false"
              echo "missing=$(IFS=,; echo "${missing[*]}")"
            } >> "$GITHUB_OUTPUT"
            echo "::warning::Skipping GA4→Notion sync because required secrets are missing: $(IFS=,; echo "${missing[*]}")"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.secrets.outputs.configured == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        if: steps.secrets.outputs.configured == 'true'
        run: npm install --save-dev @google-analytics/data @notionhq/client googleapis

      - name: Check Search Console health
        if: steps.secrets.outputs.configured == 'true'
        continue-on-error: true
        run: node scripts/check-sc-health.mjs --days 7

      - name: Run sync
        if: steps.secrets.outputs.configured == 'true'
        run: |
          EXTRA_FLAGS=""
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            EXTRA_FLAGS="--force"
          fi
          if [ -n "${{ github.event.inputs.date }}" ]; then
            node scripts/sync-analytics.mjs --date ${{ github.event.inputs.date }} $EXTRA_FLAGS
          else
            TARGET_DATE=$(TZ=Asia/Tokyo date -d "1 day ago" "+%Y-%m-%d")
            node scripts/sync-analytics.mjs --date $TARGET_DATE $EXTRA_FLAGS
          fi

      - name: Report skipped sync
        if: steps.secrets.outputs.configured != 'true'
        run: |
          echo "::warning::GA4→Notion sync was skipped. Add these GitHub secrets to enable it: ${{ steps.secrets.outputs.missing }}"

      - name: Notify on failure
        if: failure() && steps.secrets.outputs.configured == 'true'
        run: |
          echo "::error::GA4→Notion同期に失敗しました。Secretsの設定を確認してください。"
